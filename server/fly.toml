# fly.io: `cd server && fly launch --copy-config --yes` then `fly secrets set RELAY_TOKEN=... PUBLIC_URL=https://<app>.fly.dev`
app = "phloem-relay"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8787"
