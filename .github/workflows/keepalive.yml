# The relay runs on Render's free plan, which puts the service to sleep after 15 minutes without traffic and takes
# 15–60 s to wake up — long enough for the Studio's first call to time out. A ping every 10 minutes keeps it warm
# (one always-on free service fits in Render's 750 instance-hours per month).
name: Keep relay awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping relay
        run: curl -fsS --max-time 75 https://phloem-relay.onrender.com/ > /dev/null || echo "relay not reachable (will retry next run)"
