<title>Phloem Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet" />
<style>
:root { color-scheme: dark; padding: 0 !important; }
/* studio/styles.css */
:root {
  --bg: #060908;
  --bg-2: #090d0b;
  --panel: #0c120e;
  --panel-2: #111a14;
  --panel-3: #16211a;
  --line: #182619;
  --line-2: #233825;
  --text: #e8f5ec;
  --muted: #8fa796;
  --dim: #5d7265;
  --neon: #39ff14;
  --neon-2: #5cff3d;
  --neon-dim: #26b50d;
  --neon-ink: #04140a;
  --neon-soft: rgba(57, 255, 20, 0.12);
  --neon-line: rgba(57, 255, 20, 0.38);
  --glow: 0 0 0 1px rgba(57, 255, 20, 0.35), 0 0 28px -8px rgba(57, 255, 20, 0.6);
  --warn: #ffc53d;
  --err: #ff5c5c;
  --info: #6fb7ff;
  --sans:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
  --mono:
    "JetBrains Mono",
    ui-monospace,
    "SF Mono",
    Menlo,
    monospace;
  --r: 8px;
  --r-sm: 6px;
  --topbar: 48px;
  --statusbar: 26px;
  --left: 252px;
  --right: 300px;
}
* {
  box-sizing: border-box;
}
html,
body,
#root {
  height: 100%;
  margin: 0;
}
body {
  background: var(--bg);
  color: var(--text);
  font: 12.5px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
a {
  color: var(--neon);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
::selection {
  background: var(--neon);
  color: var(--neon-ink);
}
::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}
::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border-radius: 9px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-track {
  background: transparent;
}
.mono {
  font-family: var(--mono);
}
.muted {
  color: var(--muted);
}
.dim {
  color: var(--dim);
}
.small {
  font-size: 11px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.row.wrap {
  flex-wrap: wrap;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.grid3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.grid4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--neon-dim);
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 2px 0;
}
.eyebrow::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}
.eyebrow .act {
  font-family: var(--sans);
  text-transform: none;
  letter-spacing: 0;
  color: var(--muted);
  cursor: pointer;
}
.eyebrow .act:hover {
  color: var(--neon);
}
.kbd {
  font-family: var(--mono);
  font-size: 10px;
  background: #050807;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--muted);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
  transition:
    border-color 0.12s,
    background 0.12s,
    transform 0.08s,
    box-shadow 0.12s;
  user-select: none;
}
.btn:hover {
  border-color: var(--neon-dim);
  background: var(--panel-3);
}
.btn:active {
  transform: translateY(1px);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.primary {
  background: var(--neon);
  color: var(--neon-ink);
  border-color: var(--neon);
  box-shadow: 0 0 20px -6px rgba(57, 255, 20, 0.8);
}
.btn.primary:hover {
  background: var(--neon-2);
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.btn.ghost:hover {
  background: var(--panel-2);
  border-color: var(--line-2);
}
.btn.danger {
  color: var(--err);
}
.btn.danger:hover {
  border-color: rgba(255, 92, 92, 0.5);
}
.btn.sm {
  height: 26px;
  padding: 0 9px;
  font-size: 11.5px;
  font-weight: 500;
}
.btn.xs {
  height: 22px;
  padding: 0 7px;
  font-size: 11px;
  font-weight: 500;
}
.btn.block {
  width: 100%;
}
.btn.icon {
  width: 30px;
  padding: 0;
}
.btn.icon.sm {
  width: 26px;
}
.btn.icon.xs {
  width: 22px;
}
.btn.on {
  background: var(--neon-soft);
  border-color: var(--neon-line);
  color: var(--neon);
}
.btn svg {
  width: 15px;
  height: 15px;
  flex: none;
}
.btn.sm svg,
.btn.xs svg {
  width: 13px;
  height: 13px;
}
.split {
  display: inline-flex;
}
.split .btn:first-child {
  border-radius: var(--r-sm) 0 0 var(--r-sm);
}
.split .btn:last-child {
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  border-left: 0;
  padding: 0 8px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field > label {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 6px;
}
.field > label .hint {
  color: var(--dim);
  font-family: var(--mono);
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.in,
input.in,
select.in,
textarea.in {
  width: 100%;
  height: 28px;
  padding: 0 8px;
  background: #070b09;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  color: var(--text);
  outline: none;
  min-width: 0;
}
textarea.in {
  height: auto;
  min-height: 64px;
  padding: 6px 8px;
  resize: vertical;
  line-height: 1.45;
}
.in:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 2px var(--neon-soft);
}
.in::placeholder {
  color: var(--dim);
}
select.in {
  appearance: none;
  background-image:
    linear-gradient(
      45deg,
      transparent 50%,
      var(--muted) 50%),
    linear-gradient(
      135deg,
      var(--muted) 50%,
      transparent 50%);
  background-position: calc(100% - 13px) 55%, calc(100% - 8px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 24px;
}
.num {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  background: #070b09;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
}
.num:focus-within {
  border-color: var(--neon);
  box-shadow: 0 0 0 2px var(--neon-soft);
}
.num .lb {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  padding: 0 0 0 7px;
  min-width: 14px;
  cursor: ew-resize;
  user-select: none;
}
.num input {
  flex: 1;
  min-width: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  border: 0;
  outline: none;
  padding: 0 6px;
  font-family: var(--mono);
  font-size: 11.5px;
}
.num .sfx {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  padding-right: 7px;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  overflow: hidden;
  height: 28px;
  background: #070b09;
}
.seg button {
  flex: 1;
  padding: 0 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-width: 28px;
}
.seg button svg {
  width: 14px;
  height: 14px;
}
.seg button:hover {
  color: var(--text);
}
.seg button.on {
  background: var(--neon-soft);
  color: var(--neon);
}
.seg.block {
  display: flex;
  width: 100%;
}
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 0;
  cursor: pointer;
}
.toggle .sw {
  width: 30px;
  height: 17px;
  border-radius: 999px;
  background: var(--line-2);
  position: relative;
  transition: background 0.15s;
  flex: none;
}
.toggle .sw::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.15s, background 0.15s;
}
.toggle.on .sw {
  background: var(--neon-dim);
}
.toggle.on .sw::after {
  transform: translateX(13px);
  background: var(--neon-ink);
}
.swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 6px 0 4px;
  background: #070b09;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  cursor: pointer;
  min-width: 0;
}
.swatch:hover {
  border-color: var(--neon-dim);
}
.swatch .sq {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  flex: none;
  background-image:
    linear-gradient(
      45deg,
      #333 25%,
      transparent 25%),
    linear-gradient(
      -45deg,
      #333 25%,
      transparent 25%),
    linear-gradient(
      45deg,
      transparent 75%,
      #333 75%),
    linear-gradient(
      -45deg,
      transparent 75%,
      #333 75%);
  background-size: 8px 8px;
  background-position:
    0 0,
    0 4px,
    4px -4px,
    -4px 0;
  position: relative;
  overflow: hidden;
}
.swatch .sq i {
  position: absolute;
  inset: 0;
}
.swatch .v {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.swatch input[type=color] {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
}
.swatch .tk {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--neon);
  border: 1px solid var(--neon-line);
  border-radius: 3px;
  padding: 0 4px;
}
.colorpop {
  position: absolute;
  z-index: 20;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  padding: 10px;
  width: 232px;
  box-shadow: 0 16px 50px -16px #000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.colorpop .tokens {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.colorpop .tokens button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 4px 2px;
  cursor: pointer;
  color: var(--muted);
  font-size: 9.5px;
  font-family: var(--mono);
}
.colorpop .tokens button:hover,
.colorpop .tokens button.on {
  border-color: var(--neon-line);
  color: var(--neon);
}
.colorpop .tokens i {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.15);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
  white-space: nowrap;
}
.chip.on {
  color: var(--neon);
  border-color: var(--neon-line);
  background: var(--neon-soft);
}
.chip.warn {
  color: var(--warn);
  border-color: rgba(255, 197, 61, 0.4);
}
.chip.err {
  color: var(--err);
  border-color: rgba(255, 92, 92, 0.4);
}
.badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge.mailchimp {
  color: #ffe01b;
  border-color: rgba(255, 224, 27, 0.35);
}
.badge.klaviyo {
  color: #9ef0c0;
  border-color: rgba(158, 240, 192, 0.35);
}
.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}
.topbar {
  height: var(--topbar);
  display: grid;
  grid-template-columns: minmax(160px, var(--left)) 1fr minmax(200px, var(--right));
  align-items: center;
  border-bottom: 1px solid var(--line);
  background:
    linear-gradient(
      180deg,
      #0a100c,
      var(--bg));
  padding: 0 8px;
  gap: 8px;
}
.topbar .l,
.topbar .c,
.topbar .r {
  overflow: hidden;
}
.topbar .c {
  flex-wrap: nowrap;
}
@media (max-width: 1180px) {
  .topbar .r .btn span,
  .topbar .variant .k,
  .topbar .r .client-pill .t {
    display: none;
  }
  .topbar .r .client-pill {
    max-width: 40px;
    padding: 0 10px;
  }
}
@media (max-width: 1000px) {
  .topbar .row[style],
  .topbar .zoomc .tool:last-child {
    display: none;
  }
}
.topbar .l,
.topbar .c,
.topbar .r {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.topbar .c {
  justify-content: center;
}
.topbar .r {
  justify-content: flex-end;
}
.logo {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 800;
  letter-spacing: 0.3px;
  font-size: 14px;
  cursor: pointer;
  padding: 0 4px;
}
.logo svg {
  width: 22px;
  height: 22px;
  filter: drop-shadow(0 0 7px rgba(57, 255, 20, 0.55));
}
.logo .sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  font-weight: 500;
  margin-left: 2px;
}
.pname {
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  height: 28px;
  padding: 0 8px;
  font-weight: 600;
  min-width: 0;
  width: 100%;
  max-width: 220px;
  outline: none;
  text-overflow: ellipsis;
}
.pname:hover {
  border-color: var(--line-2);
}
.pname:focus {
  border-color: var(--neon);
  background: #070b09;
}
.tools {
  display: inline-flex;
  gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
}
.tool {
  width: 32px;
  height: 30px;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.tool:hover {
  color: var(--text);
  background: var(--panel-2);
}
.tool.on {
  color: var(--neon);
  background: var(--neon-soft);
  box-shadow: inset 0 0 0 1px var(--neon-line);
}
.tool svg {
  width: 16px;
  height: 16px;
}
.tool .k {
  position: absolute;
  right: 3px;
  bottom: 2px;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--dim);
}
.tool.on .k {
  color: var(--neon);
}
.zoomc {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
}
.zoomc .z {
  font-family: var(--mono);
  font-size: 11px;
  width: 52px;
  text-align: center;
  color: var(--muted);
  cursor: pointer;
}
.variant {
  display: inline-flex;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
  gap: 2px;
}
.variant button {
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  font-size: 11.5px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.variant button.on {
  background: var(--neon-soft);
  color: var(--neon);
  box-shadow: inset 0 0 0 1px var(--neon-line);
}
.variant button .k {
  font-family: var(--mono);
  font-size: 9.5px;
  opacity: 0.7;
}
.client-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--panel);
  cursor: pointer;
  max-width: 190px;
  position: relative;
}
.client-pill:hover {
  border-color: var(--neon-dim);
}
.client-pill .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--neon);
  box-shadow: 0 0 8px var(--neon);
  flex: none;
}
.client-pill .dot.off {
  background: var(--dim);
  box-shadow: none;
}
.client-pill .t {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
  font-size: 11.5px;
}
.client-pill select {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  cursor: pointer;
}
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: var(--left) 1fr var(--right);
  min-height: 0;
}
.panel {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel.right {
  border-right: 0;
  border-left: 1px solid var(--line);
}
.ptabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  padding: 0 6px;
}
.ptab {
  flex: 1;
  height: 36px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  font-size: 11.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.ptab:hover {
  color: var(--text);
}
.ptab.on {
  color: var(--neon);
  border-bottom-color: var(--neon);
  text-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
}
.ptab .n {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--dim);
}
.ptab.on .n {
  color: var(--neon);
}
.pbody {
  flex: 1;
  overflow: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card.glow {
  box-shadow: var(--glow);
  border-color: var(--neon-line);
}
.section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.statusbar {
  height: var(--statusbar);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--dim);
  background: var(--bg-2);

  border-color: rgba(255, 92, 92, 0.55);
}
.busy-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 9, 8, 0.55);
  display: grid;
  place-items: center;
  z-index: 8;
}
.busy-overlay .box {
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 10px;
  padding: 16px 18px;
  width: 320px;
  box-shadow: var(--glow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.chat {
  flex: 1;
  min-height: 160px;
  max-height: 46vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 2px 0;
}
.msg {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 100%;
}
.msg.user {
  align-items: flex-end;
}
.msg .bubble {
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-width: 92%;
}
.msg.user .bubble {
  background: var(--neon-soft);
  border: 1px solid var(--neon-line);
  border-bottom-right-radius: 3px;
}
.msg.assistant .bubble {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-bottom-left-radius: 3px;
}
.msg .acts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.chat-input {
  display: flex;
  gap: 6px;
  align-items: flex-end;
}
.chat-input textarea {
  resize: none;
  min-height: 44px;
}
.tpl-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 236px;
  gap: 12px;
  overflow-x: auto;
  padding: 4px 2px 10px;
  scroll-snap-type: x proximity;
}
.tpl-strip .tpl {
  scroll-snap-align: start;
}
.tpl .pv-skel {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      #eef1ee 25%,
      #f7f9f7 50%,
      #eef1ee 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
.tpl .meta .ds {
  font-size: 10.5px;
  line-height: 1.35;
  margin-top: 2px;
}
.palette-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background:
    linear-gradient(
      90deg,
      var(--panel),
      transparent);
}
.home-body {
  max-width: 1180px;
  gap: 32px;
}
.tpl.on .meta .nm {
  color: var(--neon);
}
.asset.on {
  outline: 2px solid var(--neon);
  outline-offset: -2px;
}
.logo .wordmark {
  font-family:
    Poppins,
    Inter,
    sans-serif;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1;
}
.logo .wordmark.studio {
  color: var(--neon);
  font-weight: 600;
  margin-left: 2px;
  text-shadow: 0 0 14px rgba(57, 255, 20, 0.35);
}
.home-top {
  height: 64px;
}
.proj-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.proj-head .eyebrow {
  flex: none;
  margin: 0;
}
.proj-head .eyebrow::after {
  width: 80px;
  flex: none;
}
.proj-head .line {
  flex: 1;
  height: 1px;
  background: var(--line);
}
.proj-head .search {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 280px;
  height: 36px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  color: var(--muted);
}
.proj-head .search input {
  background: transparent;
  border: 0;
  outline: none;
  color: var(--text);
  width: 100%;
}
.proj-head .sort {
  height: 36px;
  min-width: 130px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  padding: 0 30px 0 12px;
  color: var(--text);
  font-weight: 600;
  appearance: none;
  background-image:
    linear-gradient(
      45deg,
      transparent 50%,
      var(--muted) 50%),
    linear-gradient(
      135deg,
      var(--muted) 50%,
      transparent 50%);
  background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.proj-grid {
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}
.proj {
  border-radius: 14px;
  background:
    linear-gradient(
      180deg,
      var(--panel),
      #0a0f0c);
}
.proj .frame {
  position: relative;
  margin: 14px 14px 0;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  aspect-ratio: 4 / 2.9;
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7);
}
.proj .frame .dots {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 18px;
  background: #0c120e;
  display: flex;
  align-items: center;
  gap: 4px;
  padding-left: 8px;
  z-index: 2;
}
.proj .frame .dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon);
  opacity: 0.85;
}
.proj .frame .dots i:nth-child(2) {
  opacity: 0.55;
}
.proj .frame .dots i:nth-child(3) {
  opacity: 0.3;
}
.proj .frame img.shot {
  width: 100%;
  display: block;
  margin-top: 18px;
}
.proj .frame .phone {
  position: absolute;
  right: 10px;
  bottom: -6px;
  width: 26%;
  aspect-ratio: 9 / 16;
  border-radius: 12px;
  background: #0c120e;
  border: 2px solid #1f2d23;
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.8);
  overflow: hidden;
  z-index: 3;
}
.proj .frame .phone img {
  width: 100%;
  display: block;
}
.proj .frame .phone::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 50%;
  width: 30%;
  height: 4px;
  transform: translateX(-50%);
  border-radius: 4px;
  background: #1f2d23;
  z-index: 2;
}
.proj .meta {
  padding: 12px 14px 4px;
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 6px 8px;
  align-items: center;
}
.proj .meta .nm {
  font-size: 14px;
}
.proj .meta .sub {
  grid-column: 1 / -1;
  color: var(--muted);
  font-size: 11.5px;
  margin-top: -4px;
}
.proj .foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px 14px;
  color: var(--muted);
  font-size: 11.5px;
}
.proj .foot .prov {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: var(--text);
}
.proj .foot .prov i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
  color: #04140a;
  background: var(--neon);
}
.proj .foot .dt {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
}
.proj.new {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  align-items: center;
  min-height: 300px;
  padding: 14px;
  gap: 10px;
  border-style: dashed;
}
.proj.new .plus {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  color: var(--text);
}
.proj.new .plus .circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--neon);
  color: var(--neon-ink);
  display: grid;
  place-items: center;
  box-shadow: 0 0 24px -4px rgba(57, 255, 20, 0.8);
}
.proj.new .plus .circle svg {
  width: 26px;
  height: 26px;
}
.proj.new .plus b {
  font-size: 14px;
}
.proj.new .plus span {
  color: var(--muted);
  font-size: 11.5px;
}
.quick {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.quick button {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
  text-align: left;
}
.quick button:hover {
  border-color: var(--neon-dim);
  background: var(--panel-3);
}
.quick button svg {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.quick button .chev {
  margin-left: auto;
  color: var(--dim);
}
.feature {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 18px;
}
.feature .ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--neon-soft);
  border: 1px solid var(--neon-line);
  display: grid;
  place-items: center;
  color: var(--neon);
}
.feature .ic svg {
  width: 22px;
  height: 22px;
}
.feature .t {
  margin-bottom: 4px;
  font-size: 14px;
}
.feature .go {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  background: var(--panel-2);
  color: var(--text);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.feature .go:hover {
  border-color: var(--neon);
  color: var(--neon);
}
.tpl-strip {
  grid-auto-columns: 248px;
}
.home-top .sep {
  width: 1px;
  height: 18px;
  background: var(--line-2);
  margin: 0 2px;
}
.acct {
  display: flex;
  align-items: center;
  gap: 8px;
}
.acct .avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--neon);
  color: #04140a;
  font-weight: 800;
  font-size: 12px;
  display: grid;
  place-items: center;
}
.acct .who {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.acct .who b {
  font-size: 12px;
}
.acct .who span {
  font-size: 10.5px;
  color: var(--muted);
  font-family: var(--mono);
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.authtabs {
  width: 100%;
  margin-bottom: 12px;
  height: 32px;
}
.authtabs button.on {
  background: var(--neon-soft);
  color: var(--neon);
}
.claim {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 20px 0;
  padding: 10px 14px;
  border: 1px solid var(--neon-line);
  background: var(--neon-soft);
  border-radius: var(--r);
  font-size: 13px;
}
.claim svg {
  color: var(--neon);
}
@media (max-width: 720px) {
  .acct .who {
    display: none;
  }
  .home-top .btn.ghost.sm[href] {
    display: none;
  }
}
.asset[draggable] {
  cursor: grab;
}
.asset[draggable]:active {
  cursor: grabbing;
}
.google-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 12px;
}
.catalog {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 360px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 6px;
}
.crow {
  display: grid;
  grid-template-columns: 22px 44px minmax(0, 1fr) 110px 60px 60px 24px;
  gap: 10px;
  align-items: center;
  padding: 6px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
}
.crow:hover {
  background: var(--panel-2);
}
.crow.on {
  background: var(--neon-soft);
}
.crow .cimg {
  width: 44px;
  height: 44px;
  border-radius: 6px;
  background: var(--panel-2);
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--dim);
}
.crow .cimg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.crow .cname {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.crow .cname b {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
}
.crow .cnum {
  display: flex;
  flex-direction: column;
  font-size: 12px;
  text-align: right;
}
.crow .del {
  border: 0;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
}
.crow .del:hover {
  color: var(--err);
}
.pv-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0, 0, 0, 0.72);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 3vh 16px;
}
.pv-panel {
  width: min(960px, 100%);
  height: 94vh;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--neon-line);
  border-radius: 16px;
  box-shadow: 0 40px 120px -30px #000, 0 0 60px -20px rgba(57, 255, 20, 0.4);
  overflow: hidden;
}
.pv-head,
.pv-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.pv-foot {
  border-bottom: 0;
  border-top: 1px solid var(--line);
}
.pv-body {
  flex: 1;
  overflow: auto;
  background: #1a1d1b;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px;
}
.pv-body img {
  height: auto;
  box-shadow: 0 30px 80px -20px #000;
  border-radius: 6px;
  background: #fff;
}
.crop-bar {
  position: absolute;
  transform: translateX(-50%);
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--panel-2);
  border: 1px solid var(--neon-line);
  border-radius: 8px;
  box-shadow: var(--glow);
  white-space: nowrap;
}
