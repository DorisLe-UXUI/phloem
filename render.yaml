# Render Blueprint: https://render.com/deploy?repo=https://github.com/DorisLe-UXUI/phloem
# One web service running the relay (Docker, from server/). Add ANTHROPIC_API_KEY (and optionally GOOGLE_CLIENT_ID,
# Mailchimp/Klaviyo OAuth) in the Render dashboard; RELAY_TOKEN is generated for you.
# The database lives on the disk below (/var/data/phloem.db). Disks need a paid instance; on the free plan remove the
# `disk` block and the DATA_DIR var — the relay still works, but accounts/projects on the relay reset on every deploy.
services:
  - type: web
    name: phloem-relay
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /
    # Paid instance? Add a disk and DATA_DIR=/var/data so the SQLite database survives deploys:
    #   disk: { name: phloem-data, mountPath: /var/data, sizeGB: 1 }   envVars: - key: DATA_DIR  value: /var/data
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Free durability: an S3-compatible bucket (Cloudflare R2 free tier) the relay restores from at boot and snapshots to
      # every 10 minutes and on shutdown. Leave unset on a paid instance with a disk.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAILCHIMP_CLIENT_ID
        sync: false
      - key: MAILCHIMP_CLIENT_SECRET
        sync: false
      - key: KLAVIYO_CLIENT_ID
        sync: false
      - key: KLAVIYO_CLIENT_SECRET
        sync: false
